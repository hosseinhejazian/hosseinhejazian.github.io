# ─────────────────────────────────────────────────────────────────────────────
#  Site settings
#  Jekyll does NOT reload this file automatically — restart `jekyll serve`
#  after editing it.
# ─────────────────────────────────────────────────────────────────────────────

title            : "Hossein Hejazian"
tagline          : "Postdoctoral Research Fellow, Harvard University"
description      : >-
  Hossein Hejazian is a Postdoctoral Researcg Fellow at the Boston Children's
  Hospital and Harvard University. His research sits at the intersection of
  data-driven analytics, AI/ML, and clinical operations forhealth-care delivery
  and the business of health.

url              : "https://hosseinhejazian.github.io"
baseurl          : ""
repository       : "hosseinhejazian/hosseinhejazian.github.io"

lang             : "en-US"
locale           : "en_US"
timezone         : "America/New_York"

# Used by jekyll-seo-tag for the author / Person schema.
author:
  name           : "Hossein Hejazian"
  email          : "hossein_hejazian@hks.harvard.edu"

social:
  type           : Person
  name           : "Hossein Hejazian"
  links:
    - "https://scholar.google.com/citations?user=Di4VDJgAAAAJ"
    - "https://www.linkedin.com/in/hossein-hejazian-1ab60053/"
    - "https://github.com/hosseinhejazian"

# Default social-share / preview card image (1200 x 630).
image            : "/assets/img/og-card.png"

# Link to the full CV. Used by the hero button and the CV page.
cv_url           : "https://www.dropbox.com/scl/fi/9c045aod2trnruzputz15/CV_2026.pdf?rlkey=op9lbodhsaty5j9yuwt1hjs2m&st=erony0qr&dl=0"

# Your own name as it is written in author lists — bolded automatically
# wherever it appears in _data/publications.yml.
self_name        : "Hejazian, H."

# Google Analytics 4. Leave blank to switch analytics off entirely.
google_analytics : "G-TRP046J4R0"

# ─────────────────────────────────────────────────────────────────────────────
#  Build
# ─────────────────────────────────────────────────────────────────────────────

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .github

sass:
  style: compressed
  sourcemap: never

markdown         : kramdown
kramdown:
  input          : GFM
  hard_wrap      : false
  auto_ids       : true
  smart_quotes   : lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
