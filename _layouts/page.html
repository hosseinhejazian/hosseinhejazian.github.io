---
layout: default
---
<article class="page">
  <div class="shell">
    <header class="page-head">
      {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1 class="page-title">{{ page.title }}</h1>
      {%- if page.lead %}<div class="lead">{{ page.lead | markdownify }}</div>{% endif %}
    </header>

    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
